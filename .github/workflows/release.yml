name: Release

# --------------------------------------------------------------------------
# Tag-driven release process — read this before cutting a release.
#
# Pushing the version tag is the whole trigger. Everything downstream builds
# from that tag, and the draft release is created here only once the smoke
# tests have passed:
#
#   1. Bump PHP_LUAEXT_VERSION in src/php_luaext.h and merge it.
#   2. Tag that commit with the plain-semver version (no "v" prefix) and push:
#        git tag 1.2.0 && git push origin 1.2.0
#   3. This workflow builds the Windows DLLs at the tag, smoke-tests a source
#      install on Linux/macOS and the DLLs on Windows, then creates a draft
#      release carrying those assets.
#   4. A maintainer publishes the draft. `post-publish-verify` then runs the
#      real `pie install developgravity/lua-ext:<tag>` on all three OSes.
#   5. The maintainer pushes the stub package by hand -- a subtree split of
#      stubs/, see CONTRIBUTING.md. Deliberately not automated here: it would
#      mean giving this workflow write access to a second repository.
#
# Packagist resolves versions from git tags, so the version is visible from
# step 2 — a few minutes before the Windows assets are attached. Linux and
# macOS build from source and are unaffected; a Windows `pie install` inside
# that window fails and succeeds on retry. The alternative, keeping the tag
# from existing until publish, is what the earlier flow did: it bought that
# window back and cost a hand-dispatch step plus a ref expression that could
# not tell a branch from a tag, which silently built the wrong commit.
# xdebug — a PIE extension that ships Windows DLLs — tags first as well.
#
# Pre-releases use the same flow with an `-alpha.N`, `-beta.N` or `-rc.N`
# suffix (still no "v" prefix) and the GitHub "set as a pre-release" checkbox.
# tools/check-release-tag.sh is what decides, and says why when it refuses.
#
# `published` is the only activity type that arrives for both stable and
# pre-releases published from a draft, which is every release cut here.
# `released` and `prereleased` do not, so an RC would publish unverified.
# --------------------------------------------------------------------------

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  release:
    types: [published]
  # Rebuilding a tag after an infrastructure flake. Dispatch it against the
  # tag itself -- `gh workflow run release.yml --ref 1.2.0` -- so this path
  # resolves through the same `github.ref` as a push and cannot be pointed at
  # one commit while claiming to release another. A dispatch against a branch
  # fails the version gate on the tag-shape check.
  workflow_dispatch:

permissions:
  contents: read

env:
  LUAEXT_PACKAGE_NAME: developgravity/lua-ext
  LUAEXT_VERSION_HEADER: src/php_luaext.h
  LUAEXT_TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  # -------------------------------------------------------------------
  # Gate: tag must be plain semver (no "v" prefix, per project convention)
  # and must match PHP_LUAEXT_VERSION baked into the extension header at
  # the commit the release points to.
  # -------------------------------------------------------------------
  version-gate:
    name: Version consistency gate
    # Publishing the draft needs nothing built: the whole pipeline already ran
    # when the tag was pushed, and only post-publish-verify should fire.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # refs/tags/<version> on both paths that reach here. Deliberately
          # not `target_commitish`: it holds a branch name, so a release would
          # build whatever that branch points at now rather than the commit it
          # was cut from.
          ref: ${{ github.ref }}

      - name: Validate the release tag
        # Shape, publishability, collisions and the header version -- see
        # tools/check-release-tag.sh, which is shellcheck-gated and runs the
        # same way from a plain checkout.
        run: |
          set -euo pipefail

          # Names only, straight off the remote: the collision check needs no
          # objects, and `git fetch --tags` onto a shallow clone would pull
          # them all. The second sub strips the ^{} peel an annotated tag adds.
          LUAEXT_TAG_LIST="$(
            git ls-remote --tags origin |
              awk '{ sub(/^refs\/tags\//, "", $2); sub(/\^\{\}$/, "", $2); print $2 }' |
              sort -u
          )"
          export LUAEXT_TAG_LIST

          tools/check-release-tag.sh "${LUAEXT_TAG}" "${LUAEXT_VERSION_HEADER}"

  # -------------------------------------------------------------------
  # Build Windows DLLs from the tagged commit. The reusable workflow takes
  # the ref from the run, which is the tag on every path that gets here --
  # so the assets are named for the version rather than for a branch.
  # -------------------------------------------------------------------
  windows-build:
    name: Build Windows DLLs
    needs: version-gate
    uses: ./.github/workflows/windows-build.yml
    with:
      php-version-list: '8.5'
      arch-list: 'x64'
      ts-list: 'nts, ts'
      run-tests: true
      # Scoped exactly as ci.yml scopes it, and for the same reason: the rest
      # of the suite asserts timings far below Windows' ~15.6 ms clock tick.
      # Without this the whole suite ran here and the release could never be
      # built -- 158 of 162 passed, and the four that did not are the
      # platform-specific ones ci.yml already holds back.
      test-runner-args: 'tests/10-lua'

  # -------------------------------------------------------------------
  # Pre-publish smoke test, part 1: source build via PIE on Unix, against
  # the tag itself -- the literal command a user runs.
  # -------------------------------------------------------------------
  smoke-test-source:
    name: "pie install smoke test (source) / ${{ matrix.os }}"
    needs: windows-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: none
          # NOT "none": PIE is a Box-packaged phar that refuses to start
          # without iconv, and unpacks its downloads with zip. pie-install.yml
          # carries the same line for the same reason.
          extensions: iconv, mbstring, zip

      - name: Install PIE
        run: |
          curl -fL --output /tmp/pie.phar https://github.com/php/pie/releases/latest/download/pie.phar
          gh attestation verify --owner php /tmp/pie.phar
          chmod +x /tmp/pie.phar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: pie install the tag via a VCS repository
        env:
          # Added rather than relying on Packagist: its webhook may not have
          # fired yet, while Composer's VCS driver sees a pushed tag at once.
          #
          # Without a token that resolution rides the runner pool's anonymous
          # API rate limit and falls back to SSH on exhaustion; see
          # pie-install.yml, where the macOS pool hit exactly that.
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: |
          set -euo pipefail
          php /tmp/pie.phar repository:add vcs "${{ github.server_url }}/${{ github.repository }}"

          # PIE writes the extension into the PHP extension directory, which is
          # root-owned on a Linux runner, and it refuses to prompt for a
          # password without a terminal. macOS keeps PHP under a user-owned
          # Homebrew prefix and needs none of this. Same split as
          # pie-install.yml, which met it first.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo -E "$(command -v php)" /tmp/pie.phar install \
              "${LUAEXT_PACKAGE_NAME}:${LUAEXT_TAG}" --no-interaction
          else
            php /tmp/pie.phar install \
              "${LUAEXT_PACKAGE_NAME}:${LUAEXT_TAG}" --no-interaction
          fi

      - name: Verify extension loaded
        # Captured once, then matched -- `php -m | grep -q` is a trap under
        # pipefail, and pie-install.yml met it first. See the note there.
        run: |
          set -euo pipefail
          modules="$(php -m)"
          if ! printf '%s\n' "$modules" | grep -qi luaext; then
            echo "::error::PIE reported a successful install, but luaext is not loaded in $(command -v php)." >&2
            exit 1
          fi

  # -------------------------------------------------------------------
  # Pre-publish smoke test, part 2: the built DLLs actually load on
  # Windows. A real `pie install <tag>` isn't possible here — PIE's Windows
  # path resolves pre-packaged binaries against a published release, and
  # nothing is published until these pass — so this validates the artifact
  # directly instead. post-publish-verify runs the real command later.
  # -------------------------------------------------------------------
  smoke-test-windows-dll:
    name: DLL load smoke test / windows-latest
    needs: windows-build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ts: [nts, ts]
    steps:
      - name: Setup PHP 8.5 (${{ matrix.ts }})
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: none
          # NOT "none": PIE is a Box-packaged phar that refuses to start
          # without iconv, and unpacks its downloads with zip. pie-install.yml
          # carries the same line for the same reason.
          extensions: iconv, mbstring, zip
        env:
          phpts: ${{ matrix.ts }}

      # Downloads every zip and filters by substring rather than assuming a
      # name -- which is what caught the convention differing from the shape
      # this file originally guessed. See the extract step below.
      # Taken from this run's own artifacts: no release exists yet, and these
      # are the same bytes create-draft-release attaches, so this checks what
      # actually ships.
      - name: Download the built DLLs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dll-assets
          merge-multiple: true

      - name: Find the (${{ matrix.ts }}, x64) DLL
        shell: pwsh
        run: |
          # Assets are php_luaext-<ref>-<php>-<ts>-<vs>-x86_64.zip and the DLL
          # inside carries that same stem -- observed from a real build, where
          # this job previously looked for a bare "php_luaext.dll" that the
          # builder has never produced. Two consequences: the arch reads
          # "x86_64" rather than "x64" (both spellings are matched so a change
          # on either side does not silently select nothing), and the ts/arch
          # fields are on the DLL's own name, so the same predicate picks the
          # zip and the file.
          #
          # Whether a downloaded artifact hands back the zip or its unpacked
          # contents is the action's business, so both shapes are handled
          # rather than guessed at a second time.
          $ts = "${{ matrix.ts }}"
          $wanted = {
            param($name)
            $name -match "x86_64|x64" -and (
              ($ts -eq "ts"  -and $name -match "(?<!n)ts") -or
              ($ts -eq "nts" -and $name -match "nts")
            )
          }

          $zips = Get-ChildItem dll-assets -Recurse -Filter *.zip |
                  Where-Object { & $wanted $_.Name }

          foreach ($zip in $zips) {
            Expand-Archive -Path $zip.FullName -DestinationPath dll-extracted -Force
          }

          $dll = @(Get-ChildItem dll-extracted -Recurse -Filter 'php_luaext*.dll' -ErrorAction SilentlyContinue) +
                 @(Get-ChildItem dll-assets -Recurse -Filter 'php_luaext*.dll' -ErrorAction SilentlyContinue) |
                 Where-Object { & $wanted $_.Name } | Select-Object -First 1

          if (-not $dll) {
            $found = (Get-ChildItem dll-assets -Recurse | Select-Object -ExpandProperty Name) -join ", "
            Write-Error "No php_luaext DLL for ts=$ts, arch=x64. Downloaded: $found"
            exit 1
          }

          Write-Host "Selected $($dll.Name)"

          echo "LUAEXT_DLL_PATH=$($dll.FullName)" >> $env:GITHUB_ENV

      - name: Load the DLL and verify the extension registers
        shell: pwsh
        run: |
          # Captured, then matched. `$?` reports whether Select-String itself
          # errored, not whether it matched -- so testing it made this check
          # unable to fail. The -Quiet boolean is the answer; bind it.
          $modules = php -d "extension=$env:LUAEXT_DLL_PATH" -m
          if ($LASTEXITCODE -ne 0) {
            Write-Error "php -m failed with exit code $LASTEXITCODE."
            exit 1
          }
          if (-not ($modules | Select-String -Pattern luaext -Quiet)) {
            Write-Error "luaext did not appear in 'php -m' with the built DLL loaded."
            exit 1
          }

  # -------------------------------------------------------------------
  # Create the draft release and attach the built DLL zips to it, once and
  # only once everything above is green. A failed build therefore leaves no
  # half-made release behind -- which 0.1.0-rc.1 was.
  # -------------------------------------------------------------------
  create-draft-release:
    name: Create draft release with DLLs
    needs: [smoke-test-source, smoke-test-windows-dll]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the draft and upload the artifacts
        uses: php/php-windows-builder/release@29352c0ef9e8ce65264ea9e287881a6f7758a953 # v1 (1.9.0)
        with:
          release: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Required, and the default of false is actively wrong here: it
          # publishes, which is how 0.1.0-rc.1 went out before anything had
          # looked at its assets. Publishing that way also runs on
          # GITHUB_TOKEN, whose events create no workflow run, so
          # post-publish-verify never fired either -- the failure hid itself.
          draft: 'true'

  # -------------------------------------------------------------------
  # Post-publish confirmation: the assets are attached and the release is
  # public, so Windows can finally resolve a pre-packaged binary. Run the
  # real, literal `pie install developgravity/lua-ext:<tag>` this whole
  # pipeline exists to protect, on all three OSes. The VCS repository is
  # still added so this doesn't depend on Packagist's webhook having fired —
  # Composer's VCS driver sees a pushed tag immediately.
  # -------------------------------------------------------------------
  post-publish-verify:
    name: "pie install <tag> / ${{ matrix.os }}"
    # Fires when a person publishes. An automated publish would run on
    # GITHUB_TOKEN, whose events create no workflow run -- which is the second
    # reason create-draft-release must not publish. See its `draft` input.
    if: github.event.action == 'published'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: none
          # NOT "none": PIE is a Box-packaged phar that refuses to start
          # without iconv, and unpacks its downloads with zip. pie-install.yml
          # carries the same line for the same reason.
          extensions: iconv, mbstring, zip

      - name: Install PIE
        shell: bash
        # Attestation is verified on every OS: an unverified phar on Windows
        # would be the same supply-chain exposure it is anywhere else.
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            PIE_PATH=pie.phar
          else
            PIE_PATH=/tmp/pie.phar
          fi
          curl -fL --output "$PIE_PATH" https://github.com/php/pie/releases/latest/download/pie.phar
          gh attestation verify --owner php "$PIE_PATH"
          if [ "$RUNNER_OS" != "Windows" ]; then
            chmod +x "$PIE_PATH"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: pie install (Unix)
        if: runner.os != 'Windows'
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: |
          set -euo pipefail
          php /tmp/pie.phar repository:add vcs "${{ github.server_url }}/${{ github.repository }}"

          # Same root-owned extension directory as smoke-test-source; this job
          # has simply never run far enough to meet it.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo -E "$(command -v php)" /tmp/pie.phar install \
              "${LUAEXT_PACKAGE_NAME}:${LUAEXT_TAG}" --no-interaction
          else
            php /tmp/pie.phar install \
              "${LUAEXT_PACKAGE_NAME}:${LUAEXT_TAG}" --no-interaction
          fi

          # Captured once, then matched -- `php -m | grep -q` is a trap under
          # pipefail, and pie-install.yml met it first. See the note there.
          # This job met it too, on macOS, after a wholly successful install.
          modules="$(php -m)"
          if ! printf '%s\n' "$modules" | grep -qi luaext; then
            echo "::error::pie install succeeded, but luaext is not loaded in $(command -v php)." >&2
            exit 1
          fi

      - name: pie install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        # pwsh does not stop on a failing native command, and Select-String
        # -Quiet only prints a boolean, so without explicit checks this step
        # could pass with nothing installed at all.
        run: |
          php pie.phar repository:add vcs "${{ github.server_url }}/${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "pie repository:add failed with exit code $LASTEXITCODE."
            exit 1
          }
          php pie.phar install "$env:LUAEXT_PACKAGE_NAME`:$env:LUAEXT_TAG" --no-interaction
          if ($LASTEXITCODE -ne 0) {
            Write-Error "pie install failed with exit code $LASTEXITCODE."
            exit 1
          }
          $modules = php -m
          if ($LASTEXITCODE -ne 0) {
            Write-Error "php -m failed with exit code $LASTEXITCODE."
            exit 1
          }
          if (-not ($modules | Select-String -Pattern luaext -Quiet)) {
            Write-Error "luaext did not appear in 'php -m' after pie install."
            exit 1
          }

