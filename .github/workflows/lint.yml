name: Lint

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # clang-format: our own C sources only. Vendored Lua (third_party/) and
  # generated arginfo keep their own upstream/generator formatting and are
  # never reformatted or checked here.
  # -------------------------------------------------------------------
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check formatting
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          candidates=(src/**/*.c src/**/*.h fuzz/**/*.c fuzz/**/*.h)
          files=()
          for f in "${candidates[@]}"; do
            case "$f" in
            */luaext_arginfo.h) continue ;; # generated by gen_stub.php
            esac
            files+=("$f")
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C sources under src/ or fuzz/ yet — nothing to format-check."
            exit 0
          fi

          # Ubuntu runner images ship clang-format-16/17/18; pin the newest.
          CLANG_FORMAT=clang-format-18
          command -v "$CLANG_FORMAT" >/dev/null 2>&1 || CLANG_FORMAT=clang-format
          "$CLANG_FORMAT" --version
          "$CLANG_FORMAT" --dry-run --Werror "${files[@]}"

  # -------------------------------------------------------------------
  # editorconfig-checker: everything git-tracked, minus vendored Lua and
  # generated artifacts (see .editorconfig for the third_party overrides
  # this doesn't cover, e.g. indent style).
  # -------------------------------------------------------------------
  editorconfig:
    name: editorconfig-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install editorconfig-checker 3.11.1
        run: |
          set -euo pipefail
          curl -fsSL -o ec.tar.gz \
            https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v3.11.1/ec-linux-amd64.tar.gz
          echo "5a37922963248451e88149251e49f6ae08f69717a3918202a51fe9945e19691e  ec.tar.gz" | sha256sum -c -
          tar xzf ec.tar.gz
          chmod +x bin/ec-linux-amd64

      - name: Run editorconfig-checker
        run: |
          ./bin/ec-linux-amd64 \
            -exclude "third_party|luaext_arginfo\.h|ide-stubs" \
            -format github-actions

  # -------------------------------------------------------------------
  # shellcheck: preinstalled on the ubuntu runner image.
  # -------------------------------------------------------------------
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tools/*.sh
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tools/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts under tools/ yet — nothing to check."
            exit 0
          fi
          shellcheck --version
          shellcheck "${files[@]}"

  # -------------------------------------------------------------------
  # actionlint: schema/semantics check for every workflow in this repo,
  # including this one.
  # -------------------------------------------------------------------
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          chmod +x actionlint

      - name: Run actionlint
        run: ./actionlint -color

  # -------------------------------------------------------------------
  # Generated-artifact drift: anything checked in that's derived from a
  # pinned upstream source must match what re-deriving it produces.
  # vendor-lua.sh and audit-stdlib.php belong to other workstreams (Wave 1
  # vendoring, Phase 3 library policy) and are tolerated as "not landed
  # yet" so this workflow doesn't fail on day one of an empty repo.
  # -------------------------------------------------------------------
  drift-checks:
    name: Generated-artifact drift checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: none
          extensions: none

      - name: Run all generated-artifact drift checks
        run: tools/check-generated.sh

  lint-required:
    name: Lint required checks
    if: always()
    needs: [clang-format, editorconfig, shellcheck, actionlint, drift-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Check all lint jobs succeeded
        run: |
          for result in \
            "${{ needs.clang-format.result }}" \
            "${{ needs.editorconfig.result }}" \
            "${{ needs.shellcheck.result }}" \
            "${{ needs.actionlint.result }}" \
            "${{ needs.drift-checks.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required lint job did not succeed: $result" >&2
              exit 1
            fi
          done
