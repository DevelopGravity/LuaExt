name: Lint

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # clang-format: our own C sources only. Vendored Lua (third_party/) and
  # generated arginfo keep their own upstream/generator formatting and are
  # never reformatted or checked here.
  # -------------------------------------------------------------------
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check formatting
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          candidates=(src/**/*.c src/**/*.h fuzz/**/*.c fuzz/**/*.h)
          files=()
          for f in "${candidates[@]}"; do
            case "$f" in
            *_arginfo.h) continue ;; # generated by gen_stub.php
            esac
            files+=("$f")
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C sources under src/ or fuzz/ yet — nothing to format-check."
            exit 0
          fi

          # Pinned exactly, via pip rather than the runner image. clang-format
          # changes its output between releases -- 18.1.3 and 18.1.8 already
          # disagree about brace spacing in a macro -- so "whatever the image
          # ships" makes this gate fail on the runner's upgrade schedule rather
          # than on anything a contributor did. Bump deliberately, and reformat
          # in the same commit. Keep in step with Makefile.dev.
          pip install --quiet 'clang-format==18.1.8'
          clang-format --version
          clang-format --dry-run --Werror "${files[@]}"

  # -------------------------------------------------------------------
  # editorconfig-checker: everything git-tracked, minus vendored Lua and
  # generated artifacts (see .editorconfig for the third_party overrides
  # this doesn't cover, e.g. indent style).
  # -------------------------------------------------------------------
  editorconfig:
    name: editorconfig-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install editorconfig-checker 3.11.1
        run: |
          set -euo pipefail
          curl -fsSL -o ec.tar.gz \
            https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v3.11.1/ec-linux-amd64.tar.gz
          echo "5a37922963248451e88149251e49f6ae08f69717a3918202a51fe9945e19691e  ec.tar.gz" | sha256sum -c -
          tar xzf ec.tar.gz
          chmod +x bin/ec-linux-amd64

      - name: Run editorconfig-checker
        run: |
          # Indentation is deliberately not checked here: clang-format owns the
          # C sources and legitimately mixes a tab indent with space alignment on
          # continuation lines, and the userland-facing PHP follows PSR-12 spaces.
          # Two tools disagreeing about one file helps nobody, so this enforces
          # only what nothing else does -- charset, line endings, final newline
          # and trailing whitespace.
          ./bin/ec-linux-amd64 \
            -exclude "third_party|luaext_arginfo\.h|ide-stubs" \
            -disable-indentation \
            -format github-actions

  # -------------------------------------------------------------------
  # shellcheck: preinstalled on the ubuntu runner image.
  # -------------------------------------------------------------------
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tools/*.sh
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tools/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts under tools/ yet — nothing to check."
            exit 0
          fi
          shellcheck --version
          shellcheck "${files[@]}"

  # -------------------------------------------------------------------
  # actionlint: schema/semantics check for every workflow in this repo,
  # including this one.
  # -------------------------------------------------------------------
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          chmod +x actionlint

      - name: Run actionlint
        run: ./actionlint -color

      # actionlint checks each workflow against itself; nothing checks them
      # against each other. A workflow-level env does not cross files, so the
      # PHP version is spelled out eight more times outside ci.yml -- including
      # in release.yml, which no push exercises.
      - name: Check every workflow pins the same PHP version
        run: tools/check-workflow-php-version.sh

  # -------------------------------------------------------------------
  # Generated-artifact drift: anything checked in that's derived from a
  # pinned upstream source must match what re-deriving it produces.
  # vendor-lua.sh and audit-stdlib.php belong to other workstreams (Wave 1
  # vendoring, Phase 3 library policy) and are tolerated as "not landed
  # yet" so this workflow doesn't fail on day one of an empty repo.
  # -------------------------------------------------------------------
  drift-checks:
    name: Generated-artifact drift checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: none
          # tokenizer, not none: gen_stub.php parses the stub sources and
          # check-docs-api.php tokenizes the documentation samples. Both are
          # bundled with a normal PHP build, which is why this only shows up
          # on a runner that installs exactly what it is told to.
          extensions: tokenizer

      - name: Run all generated-artifact drift checks
        run: tools/check-generated.sh

  # -------------------------------------------------------------------
  # Documentation samples must only use API that really exists. A syntax
  # check cannot catch this: `new FileStat(sizeInBytes: 10)` parses fine
  # and still fails at runtime, because the parameter is named $size.
  # This resolves every documented constructor call against the stubs.
  # -------------------------------------------------------------------
  docs-api:
    name: Documentation API references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: none
          # tokenizer, not none: gen_stub.php parses the stub sources and
          # check-docs-api.php tokenizes the documentation samples. Both are
          # bundled with a normal PHP build, which is why this only shows up
          # on a runner that installs exactly what it is told to.
          extensions: tokenizer

      - name: Lint documentation samples
        run: |
          set -euo pipefail
          php tools/check-docs-api.php

      # The playground drifted the very first time a new Limits field shipped
      # (billHostTime), and the miss surfaced as a user report. Same stub
      # source of truth, same job.
      - name: Playground covers the config surface
        run: |
          set -euo pipefail
          php tools/check-playground-sync.php

  # -------------------------------------------------------------------
  # The watchdog thread has no TSRM context, so a LUAEXT_G() from it
  # would silently read another thread's module globals rather than
  # failing. The three files it is built from are structurally PHP-free
  # and Lua-free; this is the independent check on that, and it is here
  # rather than in the build because a compiler can only complain once
  # somebody has already added the include.
  # -------------------------------------------------------------------
  watchdog-purity:
    name: Watchdog purity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the watchdog reaches nothing PHP owns
        run: tools/check-watchdog-purity.sh

  # -------------------------------------------------------------------
  # Some C idioms compile cleanly, read correctly, and crash. ZVAL_ARR on
  # a HashTable that turns out to be zend_empty_array is the motivating
  # one: the refcount it then stamps as live sits in read-only memory.
  # A compiler cannot warn about it, so this refuses the spelling.
  # -------------------------------------------------------------------
  banned-idioms:
    name: Banned C idioms
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check src/ for idioms that compile and still fail
        run: tools/check-banned-idioms.sh

  lint-required:
    name: Lint required checks
    if: always()
    needs: [clang-format, editorconfig, shellcheck, actionlint, drift-checks, docs-api, watchdog-purity, banned-idioms]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          # Derived from needs.* rather than an explicit list, so adding a job
          # to `needs:` above is enough to make it required. Naming each one
          # again here is how a job silently stops being checked -- exactly
          # what happened once already, when a documentation check was added to
          # `needs:` but not to the list, and its failures reported green.
          echo '${{ toJSON(needs) }}'

          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::A required job did not succeed; see the run summary above." >&2
            exit 1
          fi
