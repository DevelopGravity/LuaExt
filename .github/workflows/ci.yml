name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Extension-under-test PHP floor. Bump alongside the composer.json "php" constraint.
  LUAEXT_PHP_VERSION: '8.5'
  # A pinned, immutable php-src *tag* (not the moving PHP-8.5 branch) used only
  # by the sanitizer legs below, which build PHP itself from source so that
  # the extension and the host PHP share the exact same compiler + sanitizer
  # runtime. Bump this by hand alongside upstream PHP 8.5.x point releases —
  # Renovate does not track this pin (it is not a `uses:` action reference).
  LUAEXT_SANITIZER_PHP_SRC_REF: 'php-8.5.9'

jobs:
  # ---------------------------------------------------------------------
  # Main build/test matrix: phpize && ./configure && make && make test
  # ---------------------------------------------------------------------
  # Linux and macOS are SEPARATE first-layer jobs, calling the same reusable
  # workflow. They used to be one matrix, and that made every dependent hostage
  # to the flakiest platform: GitHub cannot depend on part of a matrix, so a
  # single macOS leg failing failed the whole job and SKIPPED Windows, the
  # sanitizers and the PIE install. Windows had never once compiled as a result.
  #
  # Split, a macOS failure costs macOS.
  build:
    name: Linux
    uses: ./.github/workflows/build-matrix.yml
    with:
      runners: '["ubuntu-latest", "ubuntu-24.04-arm"]'
      php-version: '8.5'

  build-macos:
    name: macOS
    uses: ./.github/workflows/build-matrix.yml
    with:
      runners: '["macos-latest", "macos-15-intel"]'
      php-version: '8.5'

  # ---------------------------------------------------------------------
  # PIE is how this extension is actually delivered, so it gets its own gate.
  #
  # The build matrix above runs phpize/configure/make directly, which is what
  # PIE does internally -- but only "internally". It does not exercise the
  # composer.json php-ext block, the package resolution, or the declared
  # configure-options, so a wrong extension-name or a mis-declared option
  # passes all sixteen matrix jobs and only fails the first time a user runs
  # `pie install`. This runs the real thing against a stock PHP, exactly as a
  # user would.
  #
  # Windows is absent by necessity, not oversight: PIE installs pre-built DLLs
  # there from a tagged release, so it cannot be exercised before one exists.
  # release.yml covers that path.
  # ---------------------------------------------------------------------
  pie-install:
    name: "pie install / ${{ matrix.os }}"
    needs: build
    # A fork PR's head commit is not fetchable from this repository, so the
    # VCS constraint below could not resolve it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    steps:
      - name: Setup PHP ${{ env.LUAEXT_PHP_VERSION }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.LUAEXT_PHP_VERSION }}
          tools: none
          # NOT "none". PIE is a Box-packaged phar and refuses to start without
          # iconv (pulled in by symfony/polyfill-mbstring); zip is what it
          # unpacks downloads with. Stripping PHP bare here would also be
          # unrealistic -- the point of this job is to mirror what a user
          # actually has when they run pie install.
          extensions: iconv, mbstring, zip

      - name: Install PIE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fL --output /tmp/pie.phar \
            https://github.com/php/pie/releases/latest/download/pie.phar
          gh attestation verify --owner php /tmp/pie.phar
          chmod +x /tmp/pie.phar
          php /tmp/pie.phar --version

      - name: pie install this exact commit
        env:
          LUAEXT_REF: ${{ github.head_ref || github.ref_name }}
          LUAEXT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          php /tmp/pie.phar repository:add vcs \
            "${{ github.server_url }}/${{ github.repository }}"

          # PIE writes the extension into the PHP extension directory and adds
          # it to php.ini, which on a Linux runner is root-owned. It refuses to
          # prompt for a password without a terminal, so the elevation has to be
          # granted up front. macOS runners keep their PHP under a user-owned
          # Homebrew prefix and need no such thing.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo -E "$(command -v php)" /tmp/pie.phar install \
              "developgravity/lua-ext:dev-${LUAEXT_REF}#${LUAEXT_SHA}" \
              --no-interaction
          else
            php /tmp/pie.phar install \
              "developgravity/lua-ext:dev-${LUAEXT_REF}#${LUAEXT_SHA}" \
              --no-interaction
          fi

      - name: Verify PIE installed a loadable extension
        run: |
          set -uo pipefail

          # Report before asserting. PIE names the interpreter it targeted, and
          # that is not necessarily the `php` first on PATH; when those differ
          # the extension is genuinely installed and still invisible here, which
          # is worth seeing rather than inferring from an exit code.
          echo "php on PATH: $(command -v php)"
          php -v | head -1
          echo "extension_dir: $(php -r 'echo ini_get("extension_dir");')"
          # Captured once, then matched. `php -m | grep -q` is a trap under
          # pipefail: grep exits at the first match, php dies of SIGPIPE, and
          # the pipeline reports failure even though the extension is present.
          # It is a race, so it passed on Linux and failed on macOS.
          modules="$(php -m)"

          echo "--- loaded extensions matching lua ---"
          printf '%s\n' "$modules" | grep -i lua || echo "(none)"

          if ! printf '%s\n' "$modules" | grep -qi luaext; then
            echo "::error::PIE reported a successful install, but luaext is not loaded in $(command -v php)." >&2
            exit 1
          fi

          php -r 'if (!class_exists("DevelopGravity\\LuaExt\\Sandbox")) {
            fwrite(STDERR, "luaext is loaded but its classes are missing\n");
            exit(1);
          }'

          php -r 'printf("pie-installed luaext %s (%s)%s",
            DevelopGravity\LuaExt\Sandbox::extensionVersion(),
            DevelopGravity\LuaExt\Sandbox::luaVersion(),
            PHP_EOL);'

  # ---------------------------------------------------------------------
  # Gating Linux sanitizer legs: extension + php-src built with a matching
  # compiler + sanitizer runtime, so ASan/UBSan/TSan findings are real.
  # These are NOT continue-on-error — a finding here fails the build.
  # ---------------------------------------------------------------------
  sanitize-linux:
    name: "Linux sanitizer / ${{ matrix.sanitizer }} / ${{ matrix.arch }}"
    # Gated on the ordinary build. Each leg compiles php-src from source, so
    # running them against code that does not build anywhere wastes several
    # minutes and buries the one failure that matters under a wall of red.
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # arch x sanitizer, with the include: entries filling in per-arch and
        # per-sanitizer detail on the four resulting combinations.
        #
        # arm64 is not padding. It has a weaker memory model than x86, so the
        # interrupt flag's release/acquire pairing and the watchdog's
        # cross-thread writes can be perfectly correct on x64 and racy here.
        # TSan on arm64 is the only thing in this pipeline that would catch it.
        arch: [x64, arm64]
        sanitizer: [asan-ubsan, tsan]
        include:
          - arch: x64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
          - sanitizer: asan-ubsan
            luaext_sanitize: 'address,undefined'
            # php-src's own --enable-{address,undefined}-sanitizer configure
            # flags derive the right CFLAGS themselves (including probing for
            # -fno-sanitize=function/-fno-sanitize=object-size support) — no
            # manual CFLAGS needed for php-src here.
            php_src_configure_extra: '--enable-address-sanitizer --enable-undefined-sanitizer'
            extension_cc: 'gcc'
            test_scope: ''
          - sanitizer: tsan
            luaext_sanitize: 'thread'
            # php-src has no --enable-thread-sanitizer configure switch (only
            # address/undefined/memory exist — verified against php-src's
            # configure.ac). TSan is wired purely through CC=clang + CFLAGS/LDFLAGS,
            # both for php-src and for the extension below.
            php_src_configure_extra: 'CC=clang CXX=clang++ CFLAGS="-fsanitize=thread" CXXFLAGS="-fsanitize=thread" LDFLAGS="-fsanitize=thread"'
            extension_cc: 'clang'
            # The watchdog thread is the prime TSan target; scope the (expensive,
            # clang+TSan-built-PHP) run to tests/02-limits/ per the project plan
            # rather than the full suite.
            test_scope: 'tests/02-limits'
    env:
      ASAN_OPTIONS: 'exitcode=139'
      UBSAN_OPTIONS: 'print_stacktrace=1:halt_on_error=1'
      TSAN_OPTIONS: 'halt_on_error=1:second_deadlock_stack=1'
    steps:
      - name: Checkout luaext
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: luaext

      - name: Checkout php-src ${{ env.LUAEXT_SANITIZER_PHP_SRC_REF }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: php/php-src
          ref: ${{ env.LUAEXT_SANITIZER_PHP_SRC_REF }}
          path: php-src
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf bison re2c pkg-config build-essential libtool clang llvm

      - name: Cache sanitized php-src build
        id: cache-php-src
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: php-src
          key: php-src-${{ env.LUAEXT_SANITIZER_PHP_SRC_REF }}-${{ matrix.arch }}-${{ matrix.sanitizer }}-${{ hashFiles('php-src/configure.ac') }}

      - name: Build sanitized php-src (NTS)
        if: steps.cache-php-src.outputs.cache-hit != 'true'
        working-directory: php-src
        run: |
          ./buildconf --force
          ./configure \
            --prefix="$HOME/php-sanitized" \
            --disable-all \
            --enable-cli \
            --enable-debug \
            ${{ matrix.php_src_configure_extra }}
          JOBS="$(getconf _NPROCESSORS_ONLN)"
          make -j"$JOBS"

      # Installing rather than using php-src/scripts/ in place. Those generated
      # scripts are not marked executable and bake in the prefix they expect to
      # be installed under, so an extension built against them picks up paths
      # that do not exist. Cheap either way once the build itself is cached.
      - name: Install sanitized php into a prefix
        working-directory: php-src
        run: make install

      - name: Verify sanitized php-cli runs
        run: |
          "$HOME/php-sanitized/bin/php" -v
          "$HOME/php-sanitized/bin/php" -r 'echo PHP_ZTS, PHP_EOL;'

      - name: phpize (against sanitized php)
        working-directory: luaext
        run: |
          "$HOME/php-sanitized/bin/phpize"

      - name: configure extension against sanitized php
        working-directory: luaext
        env:
          CC: ${{ matrix.extension_cc }}
        run: |
          ./configure \
            --with-php-config="$HOME/php-sanitized/bin/php-config" \
            --enable-luaext-debug \
            --enable-luaext-sanitize=${{ matrix.luaext_sanitize }}

      - name: make
        working-directory: luaext
        run: |
          JOBS="$(getconf _NPROCESSORS_ONLN)"
          make -j"$JOBS"

      - name: make test
        working-directory: luaext
        # A scoped run falls back to the full suite while the scoped directory
        # does not exist yet; pointing run-tests at a missing path would fail
        # this required gate on every PR until that test phase lands.
        env:
          REPORT_EXIT_STATUS: '1'
          NO_INTERACTION: '1'
          LUAEXT_TEST_SCOPE: ${{ matrix.test_scope }}
          # Higher than the plain build matrix: a sanitized interpreter is
          # several times slower, and this leg is scoped to tests/02-limits/,
          # which is where the deliberately-unbounded scripts live.
          TEST_TIMEOUT: '60'
        run: |
          SCOPE="$LUAEXT_TEST_SCOPE"
          if [ -n "$SCOPE" ] && [ ! -d "$SCOPE" ]; then
            echo "::notice::Test scope '$SCOPE' does not exist yet; running the full suite instead."
            SCOPE=""
          fi
          make test TESTS="$SCOPE"

      - name: Upload failing test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitizer-logs-${{ matrix.sanitizer }}
          path: |
            luaext/tests/**/*.log
            luaext/tests/**/*.diff
            luaext/tests/**/*.out
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------
  # Best-effort legs: valuable signal, but known sources of false
  # positives/negatives (runtime mismatch on macOS, valgrind slowness) mean
  # these must never block a merge.
  # ---------------------------------------------------------------------
  best-effort:
    name: "Best-effort / ${{ matrix.name }}"
    needs: build
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-asan removed. It linked an ASan-instrumented extension
          # against a stock, non-instrumented PHP, so the module could not
          # load at all and all 47 tests failed on every run -- a permanently
          # red job that teaches people to ignore red. Real sanitizer coverage
          # lives in sanitize-linux, which now runs on arm64 as well as x64
          # and builds php-src with matching instrumentation.
          - name: valgrind
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP ${{ env.LUAEXT_PHP_VERSION }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.LUAEXT_PHP_VERSION }}
          tools: none
          extensions: none
        env:
          debug: 'true'

      - name: Install valgrind
        if: matrix.name == 'valgrind'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind

      - name: phpize
        run: phpize

      - name: configure (valgrind)
        if: matrix.name == 'valgrind'
        run: ./configure --enable-luaext-debug

      - name: make
        run: |
          JOBS="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
          make -j"$JOBS"

      - name: make test (valgrind, USE_ZEND_ALLOC=0)
        if: matrix.name == 'valgrind'
        # run-tests.php's `-m` flag runs every test under `valgrind --tool=memcheck`
        # and automatically forces USE_ZEND_ALLOC=0 in the test environment.
        # VALGRIND_OPTS is read by valgrind itself, not by run-tests.php.
        run: make test TESTS="-m --show-diff"
        env:
          VALGRIND_OPTS: '--suppressions=tools/valgrind.supp'

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: best-effort-logs-${{ matrix.name }}
          path: |
            tests/**/*.log
            tests/**/*.diff
            tests/**/*.out
            tests/**/*.mem
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------
  # Windows: PIE cannot build from source there (v1), so PR validation
  # reuses the same php/php-windows-builder pipeline release.yml uses to
  # produce DLLs, just without publishing anything.
  # ---------------------------------------------------------------------
  windows:
    name: Windows (PR validation)
    # NO needs:. This is the whole point of the split above -- the DLL had never
    # compiled once, because it was skipped every time an unrelated platform
    # failed first. It builds from a checkout, so it depends on nothing here.
    uses: ./.github/workflows/windows-build.yml
    with:
      php-version-list: '8.5'
      arch-list: 'x64'
      ts-list: 'nts, ts'
      # The DLL compiles now, so Windows finally runs something -- but only
      # tests/10-lua/, and the scope is the point.
      #
      # That directory is platform-neutral BY CONSTRUCTION: it asserts what Lua
      # computes, never how long anything takes, and every string.pack check
      # names an explicit width and byte order rather than inheriting the
      # machine's. So it is the one part of the suite that can be expected to
      # pass here on the first run, and a failure in it means a real difference
      # between this build and the others rather than a property of the runner.
      #
      # The rest stays out for now. Windows' CPU clock is a ~15.6 ms scheduler
      # tick and tests/02-limits/ asserts far below it, so those need guards --
      # and writing guards against failures nobody has observed is guesswork.
      # Widening this to the whole suite is a follow-up with a real run's output
      # behind it, which is the same rule that kept the build-only job honest.
      run-tests: true
      test-runner-args: 'tests/10-lua'

  # ---------------------------------------------------------------------
  # Single required status for branch protection.
  # ---------------------------------------------------------------------
  ci-required:
    name: CI required checks
    if: always()
    needs: [build, build-macos, pie-install, sanitize-linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          # Derived from needs.* rather than an explicit list, so adding a job
          # to `needs:` above is enough to make it required. Naming each one
          # again here is how a job silently stops being checked -- exactly
          # what happened once already, when a documentation check was added to
          # `needs:` but not to the list, and its failures reported green.
          echo '${{ toJSON(needs) }}'

          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::A required job did not succeed; see the run summary above." >&2
            exit 1
          fi
